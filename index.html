<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Program +50</title>
<meta name="description" content="Sledilnik za +50lbs program moči – več vaj v eni aplikaciji.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0f13">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="+50">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f13;--s1:#15181e;--s2:#1c2027;--s3:#252a33;--line:#272c35;--line2:#343a45;
    --txt:#eeece7;--muted:#8e95a1;--faint:#5f6672;
    --accent:#4a9eff;--accent-ink:#03101e;--accent-soft:rgba(74,158,255,.13);
    --neg:#ff6a45;--neg-soft:rgba(255,106,69,.13);
    --test:#ffcf3f;--test-soft:rgba(255,207,63,.10);
    --ok:#3ecf8e;--ok-soft:rgba(62,207,142,.13);--ok-ink:#03140c;
    --num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
    --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
    --tabh:62px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  html.lock body{overflow:hidden}
  body{background:var(--bg);color:var(--txt);font:15px/1.45 Inter,system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
  button:disabled{cursor:default}
  input{font:inherit;color:inherit}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .i{display:block;flex:0 0 auto}
  b,strong{font-weight:700}
  .muted{color:var(--muted)}

  /* ===== layout ===== */
  .app{max-width:560px;margin:0 auto;padding-bottom:calc(var(--tabh) + var(--sab) + 28px)}
  .top{position:sticky;top:0;z-index:20;background:rgba(13,15,19,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-top:calc(var(--sat) + 10px);border-bottom:1px solid transparent;transition:border-color .2s}
  .top.scrolled{border-bottom-color:var(--line)}
  .top-row{display:flex;align-items:center;gap:10px;padding:0 12px 10px 16px;min-height:44px}
  .top-row .logo{border-radius:8px;flex:0 0 auto}
  .top-row h1{flex:1;font:700 26px/1 var(--num);text-transform:uppercase;letter-spacing:.4px}
  .top-row h1 b{color:var(--accent)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;height:38px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .chip.add{padding:0 12px;color:var(--accent);border-style:dashed}
  .view{padding:4px 16px 0;display:flex;flex-direction:column;gap:12px}
  .card{background:var(--s1);border:1px solid var(--line);border-radius:18px}
  .pad{padding:16px}
  .lbl{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
  .gh{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:10px 4px 0}

  /* ===== buttons ===== */
  .btn{height:48px;border-radius:14px;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--s2);color:var(--txt);transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
  .btn:active:not(:disabled){transform:scale(.98)}
  .btn:disabled{opacity:.35}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
  .btn.ghost{background:transparent}
  .btn.danger{background:transparent;border-color:rgba(255,106,69,.45);color:var(--neg)}
  .btn.danger-fill{background:var(--neg);border-color:var(--neg);color:#1a0600}
  .btn.block{width:100%}
  .btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
  .icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto;transition:background .15s,color .15s}
  .icon-btn:active:not(:disabled){background:var(--s2);color:var(--txt)}
  .icon-btn:disabled{opacity:.25}
  .icon-btn.sm{width:36px;height:36px;border-radius:10px}

  /* ===== lift card ===== */
  .lift{padding:14px 14px 16px}
  .lift-h{display:flex;align-items:center;gap:6px;margin:0 0 12px 2px}
  .lift-h h2{flex:1;min-width:0;font:700 25px/1.05 var(--num);text-transform:uppercase;letter-spacing:.3px;overflow-wrap:anywhere}
  .tiles{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:8px}
  .tile{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:74px;min-width:0;position:relative;transition:border-color .15s}
  .tile:active{border-color:var(--line2)}
  .tile .tl{display:flex;align-items:center;gap:5px}
  .tile .tl .i{color:var(--test)}
  .tile .tv{font:700 32px/1 var(--num);letter-spacing:.2px}
  .tile .tv small{font:600 14px Inter,sans-serif;color:var(--muted);margin-left:3px}
  .tile .tp{font:700 19px/1.1 var(--num);letter-spacing:.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:16px}
  .tile .ts{font-size:12px;color:var(--muted)}
  .tile .chev{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--faint)}
  .cyc{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
  .cyc b{font:700 17px var(--num);color:var(--txt)}
  .cyc b span{color:var(--muted);font-weight:600}
  .cells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cell{position:relative;height:42px;border-radius:11px;background:var(--s2);border:1px solid var(--line);font:700 17px/1 var(--num);color:var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s,color .15s}
  .cell.done{background:var(--ok-soft);border-color:rgba(62,207,142,.3);color:var(--ok)}
  .cell.now{border-color:var(--accent);color:var(--txt)}
  .cell.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .cell.done.sel{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
  .cell .dots{position:absolute;bottom:4px;left:0;right:0;display:flex;justify-content:center;gap:3px}
  .cell .dots i{width:4px;height:4px;border-radius:50%}
  .dots .g{background:var(--neg)} .dots .t{background:var(--test)}
  .cell.sel .dots i{background:currentColor}

  /* ===== notices ===== */
  .banner{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;font-size:13.5px;line-height:1.4}
  .banner > .i{color:var(--accent)}
  .banner > div{flex:1}
  .banner p{color:var(--muted);font-size:13px;margin-top:2px}
  .banner.info{background:var(--accent-soft);border-color:rgba(74,158,255,.3)}
  .donecard{display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;background:linear-gradient(135deg,rgba(62,207,142,.16),rgba(62,207,142,.04));border-color:rgba(62,207,142,.35)}
  .donecard > .i{color:var(--ok)}
  .donecard div{flex:1}
  .donecard b{display:block;font:700 20px/1.1 var(--num);text-transform:uppercase;letter-spacing:.4px}
  .donecard small{color:var(--muted);font-size:12.5px}

  /* ===== workout card ===== */
  .wk{overflow:hidden;scroll-margin-top:130px}
  .wk-h{display:flex;align-items:center;gap:4px;padding:8px;border-bottom:1px solid var(--line)}
  .wk-t{flex:1;text-align:center;min-width:0}
  .wk-title{font:700 23px/1.1 var(--num);text-transform:uppercase;letter-spacing:.5px}
  .wk-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:1px;display:flex;align-items:center;justify-content:center;gap:5px}
  .wk-sub.now{color:var(--accent)} .wk-sub.done{color:var(--ok)}
  .sets{list-style:none}
  .set{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 16px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .15s}
  .set + .set,.testli + .set{border-top:1px solid var(--line)}
  .set.ro{cursor:default}
  .set:not(.ro):active{background:var(--s2)}
  .set.t-g::before,.set.t-t::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0}
  .set.t-g::before{background:var(--neg)} .set.t-t::before{background:var(--test)}
  .tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;color:transparent;flex:0 0 auto;transition:background .15s,border-color .15s,color .15s,transform .15s}
  .set.on .tick{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
  .set.on:not(.ro) .tick{transform:scale(1.04)}
  .set-main{flex:1;min-width:0;transition:opacity .15s}
  .set.on .set-main{opacity:.5}
  .l1{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  .w{font:700 31px/1 var(--num);letter-spacing:.2px}
  .w small{font:600 13px Inter,sans-serif;color:var(--muted);margin-left:2px}
  .x{color:var(--faint);font-size:16px;font-weight:500}
  .r{font:700 25px/1 var(--num)}
  .pl{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:12px;color:var(--muted);min-height:18px}
  .pl em{font-style:normal;color:var(--faint)}
  .pv{display:flex;align-items:center;gap:2px;height:18px;flex:0 0 auto}
  .pv i{width:5px;border-radius:1.5px;display:block}
  .set-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
  .pct{font-size:12px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;padding:3px 8px;border-radius:7px}
  .badge.g{background:var(--neg-soft);color:var(--neg)}
  .badge.t{background:var(--test-soft);color:var(--test)}
  .testli{list-style:none;padding:0 14px 14px 62px}
  .testbox{background:var(--test-soft);border:1px solid rgba(255,207,63,.25);border-radius:14px;padding:11px}
  .testbox .tq{font-size:12.5px;color:var(--test);font-weight:600;margin:0 2px 9px}
  .tbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tb{background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:8px 4px;text-align:center;line-height:1.2;transition:transform .1s}
  .tb:active{transform:scale(.97)}
  .tb b{display:block;font:700 19px/1.1 var(--num)}
  .tb small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .tb.dn{border-color:rgba(255,106,69,.5)} .tb.dn small{color:var(--neg)}
  .tb.up{border-color:rgba(62,207,142,.5)} .tb.up small{color:var(--ok)}
  .testbox.rec{display:flex;align-items:center;gap:10px}
  .testbox.rec > div{flex:1;min-width:0}
  .testbox.rec .tq{margin:0 0 2px}
  .testbox.rec b{font:700 20px/1 var(--num);color:var(--test)}
  .testbox.rec span.tm{font-size:12px;color:var(--muted);margin-left:6px}
  .wk-f{padding:12px 14px 14px;border-top:1px solid var(--line)}
  .rest{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin:-2px 0 10px}
  .rest b{font:700 20px/1 var(--num);color:var(--txt);font-variant-numeric:tabular-nums;min-width:3.2ch}
  .wk-f .btn{height:54px;font-size:16px}

  /* ===== stats / chart / history ===== */
  .statg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:0}
  .stat .sv{display:block;font:700 28px/1.1 var(--num);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .sv small{font:600 13px Inter,sans-serif;color:var(--muted);margin-left:3px}
  .stat .sd{display:block;font-size:12px;font-weight:600;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .sd.up{color:var(--ok)} .stat .sd.dn{color:var(--neg)}
  .ch-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .chart{display:block;width:100%;height:auto}
  .chart .gl{stroke:var(--line2);stroke-dasharray:3 4}
  .chart .lb{fill:var(--muted);font:500 11px Inter,sans-serif}
  .chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart .dt{fill:var(--bg);stroke:var(--accent);stroke-width:2}
  .chart .dl{fill:var(--accent)}
  .chart .vl{fill:var(--txt);font:700 14px var(--num)}
  .hrow{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px}
  .hrow + .hrow{border-top:1px solid var(--line)}
  .hrow .hd{font-size:12.5px;color:var(--muted);width:84px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .hrow .hm{font:700 19px/1 var(--num);white-space:nowrap}
  .hrow .hm small{font:600 12px Inter,sans-serif;color:var(--muted);margin-left:2px}
  .hrow .hx{font-size:12px;font-weight:700;width:46px;flex:0 0 auto}
  .hrow .hx.up{color:var(--ok)} .hrow .hx.dn{color:var(--neg)} .hrow .hx.eq{color:var(--faint)}
  .hrow .hn{flex:1;font-size:12px;color:var(--faint);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--faint);font-size:13px;text-align:center;padding:26px 10px;line-height:1.55}
  .empty.sm{padding:16px 6px}

  /* ===== calculator ===== */
  .stepper{display:flex;align-items:stretch;gap:8px}
  .stepper > button{width:58px;height:62px;border-radius:15px;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;flex:0 0 auto;transition:transform .1s,opacity .15s}
  .stepper > button:active:not(:disabled){transform:scale(.95)}
  .stepper > button:disabled{opacity:.3}
  .stepper .sv{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:15px;height:62px;padding:0 10px;cursor:text}
  .stepper .sv:focus-within{border-color:var(--accent)}
  .stepper input{width:100%;min-width:0;max-width:5.2ch;background:none;border:0;text-align:right;font:700 38px/1 var(--num);letter-spacing:.3px}
  .stepper input:disabled{opacity:.55}
  .stepper input:focus-visible,.inpchip input:focus-visible{outline:none}
  .stepper .sv span{font-weight:600;color:var(--muted);font-size:15px}
  .pcts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:8px}
  .pchip{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center;line-height:1.15}
  .pchip:active{border-color:var(--accent)}
  .pchip b{display:block;font:700 16px var(--num)}
  .pchip small{display:block;font-size:11px;color:var(--muted)}
  .bars{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .bars .chip{padding:0 14px}
  .bars .inpchip{padding:0 6px;width:84px}
  .bars .inpchip:focus-within{border-color:var(--accent)}
  .bars .inpchip input{width:100%;background:none;border:0;text-align:center;font-weight:600;font-size:16px}
  .barviz{display:flex;align-items:center;height:118px;margin:4px -4px 12px;overflow:hidden}
  .barviz .sleeve{flex:0 0 14px;height:14px;background:#b8c0cb;border-radius:3px}
  .barviz .collar{flex:0 0 6px;height:26px;background:#d4dae2;border-radius:2px}
  .barviz .shaft{flex:1 1 auto;min-width:30px;height:8px;background:linear-gradient(#cfd5dd,#9aa3ae)}
  .barviz .plates{display:flex;align-items:center;gap:2px;height:100%;background:linear-gradient(transparent 43%,#b8c0cb 43%,#b8c0cb 57%,transparent 57%)}
  .barviz .plates:empty{width:24px}
  .barviz .plates i{display:block;border-radius:3px;flex:0 1 auto;min-width:4px;box-shadow:inset -2px 0 0 rgba(0,0,0,.18)}
  .cres{display:flex;flex-direction:column;gap:10px}
  .cres .big{display:block;font:700 34px/1 var(--num);margin-top:3px}
  .cres .big small{font:600 14px Inter,sans-serif;color:var(--muted)}
  .pchips{display:flex;flex-wrap:wrap;gap:6px}
  .pchip2{display:inline-flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:6px 11px 6px 8px;font:700 17px/1 var(--num)}
  .pchip2 i{width:8px;height:18px;border-radius:2px;display:block}
  .warn{color:var(--neg);font-size:13px}

  /* ===== settings rows ===== */
  .group{overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:58px;width:100%}
  .row + .row{border-top:1px solid var(--line)}
  button.row:active,.rmain:active{background:var(--s2)}
  .row > .i{color:var(--muted)}
  .rt{flex:1;min-width:0}
  .rt b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rt small{display:block;color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.35;margin-top:1px}
  .rv{color:var(--muted);font:600 17px var(--num);white-space:nowrap}
  .row .chev{color:var(--faint)}
  .row.add{color:var(--accent);font-weight:600}
  .row.add > .i{color:var(--accent)}
  .lrow{padding:0 6px 0 0;gap:2px}
  .rmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;min-height:58px;align-self:stretch}
  .tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--s3);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .seg{display:inline-flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;flex:0 0 auto}
  .seg button{height:34px;min-width:52px;padding:0 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:14px;text-align:center}
  .seg button.on{background:var(--accent);color:var(--accent-ink)}
  .foot{color:var(--faint);font-size:12px;text-align:center;line-height:1.6;padding:8px 10px 0}

  /* ===== switch ===== */
  .switch{-webkit-appearance:none;appearance:none;width:50px;height:30px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);position:relative;flex:0 0 auto;cursor:pointer;transition:background .2s,border-color .2s}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
  .switch:checked{background:var(--accent);border-color:var(--accent)}
  .switch:checked::after{transform:translateX(20px);background:#fff}
  .switch.lockc:checked{background:var(--test);border-color:var(--test)}
  .switch.lockc:checked::after{background:#2a2000}
  .srow{display:flex;align-items:center;gap:14px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;cursor:pointer}
  .srow .rt b{display:flex;align-items:center;gap:6px;white-space:normal}

  @media (min-width:600px){ .layer{align-items:center} .sheet{border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:20px} }

  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important} }
</style>

<script>
'use strict';
// ===== utils =====
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const I=(n,s=20)=>'<svg class="i" width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const r2=n=>Math.round(n*100)/100;
// slovenske množinske oblike: [1, 2, 3–4, 5+]
function pl(n,f){ const m=Math.abs(n)%100; return n+' '+(m===1?f[0]:m===2?f[1]:(m===3||m===4)?f[2]:f[3]); }
const TRN=['trening','treninga','treningi','treningov'], SETF=['set','seta','seti','setov'];
const haptic=(ms)=>{ try{ if(navigator.vibrate) navigator.vibrate(ms||12); }catch(e){} };

// ===== built-in programs (% of 1RM) =====
function plus50(){return[
  {s:[[77.5,'6','n'],[82.5,'5','n'],[82.5,'5','n'],[85,'4','n'],[85,'4','n']]},
  {s:[[85,'3','n'],[85,'3','n'],[92.5,'2','n'],[92.5,'2','n'],[102.5,'1','g']]},
  {s:[[80,'6','n'],[85,'5','n'],[85,'5','n'],[87.5,'4','n'],[87.5,'4','n']]},
  {s:[[87.5,'3','n'],[87.5,'3','n'],[95,'2','n'],[95,'2','n'],[105,'1','g']]},
  {s:[[82.5,'6','n'],[85,'5','n'],[85,'5','n'],[90,'2–4','t']]},
  {s:[[90,'3','n'],[90,'3','n'],[97.5,'2','n'],[97.5,'2','n'],[107.5,'1','g']]},
  {s:[[85,'5','n'],[85,'5','n'],[92.5,'3','n'],[92.5,'3','n'],[92.5,'2–4','t']]},
  {s:[[92.5,'3','n'],[92.5,'3','n'],[100,'1','n'],[100,'1','n'],[110,'1','g']]},
  {s:[[85,'5','n'],[85,'5','n'],[95,'3','n'],[95,'3','n'],[95,'2–4','t']]},
  {s:[[95,'3','n'],[95,'3','n'],[102.5,'2','n'],[102.5,'2','n'],[107.5,'1','n']]},
  {s:[[87.5,'5','n'],[87.5,'5','n'],[97.5,'3','n'],[97.5,'3','n'],[97.5,'2–4','t']]},
  {s:[[95,'3','n'],[95,'3','n'],[102.5,'2','n'],[102.5,'2','n'],[110,'1','n']]},
  {s:[[90,'5','n'],[100,'3','n'],[100,'3','n'],[107.5,'2','n'],[107.5,'2','n']]},
  {s:[[97.5,'3','n'],[105,'2','n'],[107.5,'1','n']]}
];}
function p5x5(){const a=[];for(let i=0;i<8;i++){const pct=70+2.5*i;a.push({s:[[pct,'5','n'],[pct,'5','n'],[pct,'5','n'],[pct,'5','n'],[pct,'5','n']]});}return a;}
function p531(){return[
  {s:[[58.5,'5','n'],[67.5,'5','n'],[76.5,'5+','t']]},
  {s:[[63,'3','n'],[72,'3','n'],[81,'3+','t']]},
  {s:[[67.5,'5','n'],[76.5,'3','n'],[85.5,'1+','t']]},
  {s:[[36,'5','n'],[45,'5','n'],[54,'5','n']]}
];}
function seedPrograms(){return{
  plus50:{name:'Program +50 lbs',builtin:true,workouts:plus50()},
  p5x5:{name:'5×5 progresija',builtin:true,workouts:p5x5()},
  p531:{name:'5/3/1 (en cikel)',builtin:true,workouts:p531()}
};}
const TYPE={n:'Normalno',g:'Negativ',t:'Test'};
const TYPES=['n','g','t'];
const SEED=[
  {id:'bench',name:'Bench press',max:100},
  {id:'incline',name:'Incline bench press',max:80},
  {id:'squat',name:'Squat',max:130},
  {id:'deadlift',name:'Deadlift',max:160},
  {id:'ohp',name:'Military press',max:60}
];
function newLift(name,max,custom){
  return {name,max,custom:!!custom,program:'plus50',progress:{},doneDates:{},testRes:{},setDone:{},history:[],locked:false,noPlates:false,stats:{total:0,cycles:0,best:max,last:null}};
}
function DEFAULT(){
  const lifts={},order=[];
  SEED.forEach(s=>{ lifts[s.id]=newLift(s.name,s.max,false); order.push(s.id); });
  return {unit:'kg',active:'bench',order,lifts,programs:seedPrograms()};
}
let state=DEFAULT();
const LS_KEY='plus50_state_v2';

// ===== persistence =====
function sanitizeWorkouts(w){
  if(!Array.isArray(w)) return [];
  return w.map(x=>({s:(Array.isArray(x&&x.s)?x.s:[]).map(st=>{
    const pct=parseFloat(st[0]); return [isFinite(pct)?pct:0, String(st[1]==null?'':st[1]), TYPES.includes(st[2])?st[2]:'n'];
  })}));
}
function applyLoaded(p){
  if(!(p&&p.lifts&&typeof p.lifts==='object')){ state=DEFAULT(); return; }
  const ns=DEFAULT();
  ns.unit = p.unit==='lb'?'lb':'kg';
  // custom programs (built-ins always come fresh from DEFAULT)
  if(p.programs&&typeof p.programs==='object'){
    Object.entries(p.programs).forEach(([id,pr])=>{
      if(ns.programs[id]&&ns.programs[id].builtin) return;
      if(!pr||!pr.workouts) return;
      const w=sanitizeWorkouts(pr.workouts); if(!w.length) return;
      ns.programs[id]={name:String(pr.name||'Program'),builtin:false,workouts:w};
    });
  }
  const order=Array.isArray(p.order)&&p.order.length?p.order:Object.keys(p.lifts);
  ns.lifts={}; ns.order=[];
  const mapArr=(o,fn)=>{ const r={}; if(o&&typeof o==='object') Object.entries(o).forEach(([k,v])=>{ if(Array.isArray(v)) r[k]=v.map(fn); }); return r; };
  order.forEach(id=>{
    const L=p.lifts[id]; if(!L||ns.lifts[id]) return;
    let prog=L.program; if(!ns.programs[prog]) prog='plus50';
    const history=Array.isArray(L.history)?L.history.filter(h=>h&&isFinite(h.t)&&isFinite(h.max)).map(h=>({t:+h.t,max:+h.max,note:String(h.note||'')})):[];
    const mx=(typeof L.max==='number'&&isFinite(L.max))?L.max:100;
    const st=(L.stats&&typeof L.stats==='object')?L.stats:{};
    ns.lifts[id]={name:String(L.name||'Vaja'),max:mx,custom:!!L.custom,program:prog,
      progress:mapArr(L.progress,Boolean),
      doneDates:mapArr(L.doneDates,x=>(x==null?null:+x)),
      testRes:mapArr(L.testRes,x=>(x&&typeof x==='object')?{d:parseInt(x.d)||0,t:+x.t||Date.now(),lab:String(x.lab||'')}:null),
      setDone:mapArr(L.setDone,r=>Array.isArray(r)?r.map(Boolean):[]),
      history,locked:!!L.locked,noPlates:!!L.noPlates,
      stats:{total:Math.max(0,parseInt(st.total)||0),cycles:Math.max(0,parseInt(st.cycles)||0),best:(parseFloat(st.best)||0)||mx,last:st.last?+st.last:null}};
    ns.order.push(id);
  });
  if(!ns.order.length){ state=DEFAULT(); return; }
  ns.active = ns.lifts[p.active]?p.active:ns.order[0];
  state=ns;
}

// ===== helpers =====
const step=()=>state.unit==='kg'?2.5:5;
function calc(pct,max){ const s=step(); return Math.round((Math.round((max*pct/100)/s)*s)*10)/10; }
const fmt=n=>{ n=Math.round(n*100)/100; return Number.isInteger(n)?String(n):String(n).replace('.',','); };
const al=()=>state.lifts[state.active];
const ap=()=>state.programs[al().program];
function fitArr(L,key,fill){
  const pid=L.program, wc=state.programs[pid].workouts.length;
  if(!L[key]) L[key]={};
  let a=L[key][pid]; if(!Array.isArray(a)) a=[];
  if(a.length<wc) a=a.concat(Array(wc-a.length).fill(fill));
  if(a.length>wc) a=a.slice(0,wc);
  L[key][pid]=a; return a;
}
const progArr=L=>fitArr(L,'progress',false);
const dateArr=L=>fitArr(L,'doneDates',null);
const testArr=L=>fitArr(L,'testRes',null);
function setArr(L){
  const pid=L.program, W=state.programs[pid].workouts;
  if(!L.setDone) L.setDone={};
  const a=Array.isArray(L.setDone[pid])?L.setDone[pid]:[];
  L.setDone[pid]=W.map((w,i)=>{ const r=Array.isArray(a[i])?a[i].slice(0,w.s.length):[]; while(r.length<w.s.length) r.push(false); return r; });
  return L.setDone[pid];
}
const dstr=t=>new Date(t).toLocaleDateString('sl-SI');
const mmss=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function updateBest(L){ if(L.max>(L.stats.best||0)) L.stats.best=L.max; }
function toggleDone(L,i){
  const arr=progArr(L), dates=dateArr(L);
  const prevAll=arr.length>0&&arr.every(Boolean), was=arr[i], wasLocked=L.locked;
  arr[i]=!was;
  if(!was){
    L.stats.total++; L.stats.last=Date.now(); dates[i]=Date.now();
    if(!L.locked) L.locked=true;            // začetek cikla -> zakleni max
    if(arr.every(Boolean)) L.stats.cycles++;
  }else{
    L.stats.total=Math.max(0,L.stats.total-1); dates[i]=null;
    if(prevAll) L.stats.cycles=Math.max(0,L.stats.cycles-1);
  }
  save(); return wasLocked;
}
function resetCycle(id){
  const L=state.lifts[id], pid=L.program, n=state.programs[pid].workouts.length;
  L.progress[pid]=Array(n).fill(false); L.doneDates[pid]=Array(n).fill(null); L.testRes[pid]=Array(n).fill(null);
  if(L.setDone) L.setDone[pid]=[];
  L.locked=false; delete view.sel[id]; if(rest&&rest.k.startsWith(id+'|')) rest=null;
  save();
}

            lb:{45:'#3b82f6',35:'#f2c94c',25:'#34c98e',10:'#e8e6e1',5:'#e5484d',2.5:'#a3abb6'}};

function plateSplit(total,bar){
  if(!(total>=bar)) return {under:true,side:0,used:[],rem:0};
  let rem=(total-bar)/2; const side=rem, used=[];
  PLATES[state.unit].forEach(p=>{ while(rem>=p-1e-9){ used.push(p); rem=Math.round((rem-p)*1000)/1000; } });
  return {under:false,side,used,rem};
}
function groupPlates(used){ const g=[]; used.forEach(p=>{ const l=g[g.length-1]; if(l&&l[0]===p) l[1]++; else g.push([p,1]); }); return g; }
function platesLine(wt){
  const u=state.unit, bar=ui.bar[u]; if(wt<bar) return '';
  const r=plateSplit(wt,bar);
  if(!r.used.length) return '<div class="pl">prazen drog</div>';
  return '<div class="pl"><span class="pv">'+r.used.map(p=>'<i style="height:'+Math.round(PH[u][p]*18)+'px;background:'+PCOL[u][p]+'"></i>').join('')+'</span><span>'

}

const layers=[]; let backN=0, skipPop=0;
function openLayer(el,onClose){
  hideToast();
  el.classList.add('show'); layers.push({el,onClose});
  document.documentElement.classList.add('lock');
  try{ history.pushState({ov:layers.length},''); }catch(e){}
}
function closeTop(viaPop){
  const L=layers.pop(); if(!L) return;
  L.el.classList.remove('show');
  if(!layers.length) document.documentElement.classList.remove('lock');
  if(!viaPop){
    backN++;
    if(backN===1) setTimeout(()=>{ const n=backN; backN=0; skipPop++; try{ history.go(-n); }catch(e){ skipPop--; } },0);
  }
  if(L.onClose) L.onClose();
}
addEventListener('popstate',()=>{ if(skipPop>0){ skipPop--; return; } closeTop(true); });

  const body=lay.querySelector('.sheet');

  openLayer(lay);

  const W=340,H=180,pL=12,pR=40,pT=22,pB=26, ms=pts.map(p=>p.max);
  const mn=Math.min(...ms), mx=Math.max(...ms), s=step();
  let lo=mn,hi=mx; if(hi-lo<s*2){ lo-=s; hi+=s; } else { const pd=(hi-lo)*.15; lo-=pd; hi+=pd; }
  const n=pts.length, X=i=>pL+i/(n-1)*(W-pL-pR), Y=m=>pT+(1-(m-lo)/(hi-lo))*(H-pT-pB);
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.max).toFixed(1)).join(' ');
  const area=line+' L'+X(n-1).toFixed(1)+' '+(H-pB)+' L'+X(0).toFixed(1)+' '+(H-pB)+' Z';
  const ticks=mn===mx?[mn]:[mn,mx];
  let g=ticks.map(v=>'<line class="gl" x1="'+pL+'" x2="'+(W-pR+4)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="lb" x="'+(W-pR+8)+'" y="'+(Y(v)+4).toFixed(1)+'">'+fmt(v)+'</text>').join('');
  const last=pts[n-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Graf maxa skozi čas">'
    +'<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9eff" stop-opacity=".28"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></linearGradient></defs>'
    +g+'<path d="'+area+'" fill="url(#cg)"/><path class="ln" d="'+line+'"/>'
    +pts.map((p,i)=>'<circle class="'+(i===n-1?'dl':'dt')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.max).toFixed(1)+'" r="'+(i===n-1?4.5:3)+'"/>').join('')
    +'<text class="vl" x="'+X(n-1).toFixed(1)+'" y="'+(Y(last.max)-10).toFixed(1)+'" text-anchor="end">'+fmt(last.max)+'</text>'
    +'<text class="lb" x="'+pL+'" y="'+(H-6)+'">'+dstr(pts[0].t)+'</text><text class="lb" x="'+(W-pR)+'" y="'+(H-6)+'" text-anchor="end">'+dstr(last.t)+'</text></svg>';
}
function renderProgress(){
  const L=al(), s=L.stats, u=state.unit, a=progArr(L), nd=a.filter(Boolean).length;
  const hist=L.history.map((x,idx)=>Object.assign({idx},x)).sort((x,y)=>x.t-y.t);
  const first=hist.length?hist[0].max:null, diff=first==null?0:r2(L.max-first);
  const stat=(lab,val,sub,cls)=>'<div class="stat"><span class="lbl">'+lab+'</span><span class="sv">'+val+'</span>'+(sub?'<span class="sd '+(cls||'')+'">'+sub+'</span>':'')+'</div>';
  let h='<section class="statg">'
    +stat('Trenutni max',fmt(L.max)+'<small>'+u+'</small>',first==null||!diff?'':(diff>0?'+':'−')+fmt(Math.abs(diff))+' '+u+' od začetka',diff>0?'up':'dn')
    +stat('Osebni rekord',fmt(s.best||L.max)+'<small>'+u+'</small>')
    +stat('Ta cikel',nd+'<small>/ '+a.length+'</small>',ap().name)
    +stat('Treningi',String(s.total),pl(s.cycles,['zaključen cikel','zaključena cikla','zaključeni cikli','zaključenih ciklov']))
    +'</section>';
  h+='<section class="card pad"><div class="ch-h"><span class="lbl">Max skozi čas</span><button class="btn sm" data-act="logMax">'+I('plus',16)+'Zabeleži</button></div>'+chart(hist)+'</section>';
  h+='<div class="gh">Zgodovina</div>';
  if(!hist.length){
    h+='<section class="card"><div class="empty">Še ni vnosov.<br>Zadnji trening: '+(s.last?dstr(s.last):'—')+'</div></section>';
  }else{
    h+='<section class="card group">';
    for(let k=hist.length-1;k>=0;k--){
      const e=hist[k], prev=k>0?hist[k-1].max:null, d=prev==null?null:r2(e.max-prev);
      h+='<div class="hrow"><span class="hd">'+dstr(e.t)+'</span><span class="hm">'+fmt(e.max)+'<small>'+u+'</small></span>'
        +'<span class="hx '+(d==null?'eq':d>0?'up':d<0?'dn':'eq')+'">'+(d==null?'':d>0?'+'+fmt(d):d<0?'−'+fmt(-d):'±0')+'</span>'
        +'<span class="hn">'+esc(e.note)+'</span><button class="icon-btn sm" data-act="histDel" data-k="'+e.idx+'" aria-label="Izbriši vnos">'+I('x',16)+'</button></div>';
    }
    h+='</section>';
  }
  $('#view').innerHTML=h;
}

// ===== backup =====
function exportJSON(){
  saveNow();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url; a.download='plus50-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup izvožen.');
}
function importJSON(file){
  const r=new FileReader();
  r.onload=async()=>{
    let p; try{ p=JSON.parse(r.result); if(!p||!p.lifts) throw 0; }catch(e){ toast('Napaka: datoteka ni veljaven backup.',{bad:true}); return; }
    if(!await ask({title:'Uvozim backup?',text:'Trenutni podatki na tej napravi bodo zamenjani s podatki iz datoteke.',ok:'Uvozi'})) return;
    applyLoaded(p); view.sel={}; rest=null; calcT=null; saveNow(); render(); toast('Podatki obnovljeni.');
  };
  r.onerror=()=>toast('Datoteke ni bilo mogoče prebrati.',{bad:true});
  r.readAsText(file);
}

// ===== unit =====
function setUnit(u){
  const f=u==='lb'?2.20462:1/2.20462, s=u==='kg'?2.5:5, rd=v=>Math.round((v*f)/s)*s;
  Object.values(state.lifts).forEach(l=>{ l.max=rd(l.max); l.stats.best=rd(l.stats.best||0); l.history.forEach(h=>{ h.max=rd(h.max); }); });
  state.unit=u; calcT=null; save(); render();
}

    else if(isIOS) openSheet('<h3 class="sh-t">Namesti na iPhone</h3><p class="sh-p">V Safariju tapni gumb <b>Deli</b> (kvadrat s puščico), nato izberi <b>Dodaj na začetni zaslon</b>.</p><div class="sh-actions"><button class="btn primary" data-close>V redu</button></div>');
  },
  installX(){ ui.installHide=true; try{ localStorage.setItem('plus50_install_hide','1'); }catch(e){} render(); },

  // trening
  liftMenu(){ liftSheet(state.active); },
  maxSheet(){ maxSheet(); },
  progSheet(){ progSheet(); },
  pick(el){ const i=+el.dataset.i; if(i<0||i>=ap().workouts.length) return; view.sel[state.active]=i; render(); },
  tick(el){
    const L=al(), i=curSel(), j=+el.dataset.j; if(progArr(L)[i]) return;
    const row=setArr(L)[i], hadFocus=el===document.activeElement; row[j]=!row[j];
    if(row[j]){ rest={k:restKey(i),t:Date.now()}; haptic(); }
    save(); render();
    if(hadFocus){ const f=document.querySelector('.set[data-j="'+j+'"]'); if(f) f.focus(); }
  },
  test(el){
    const L=al(), pid=L.program, i=curSel(), tests=testArr(L); if(tests[i]) return;
    const d=+el.dataset.d, lab=el.dataset.lab, s=step(), t=Date.now();
    if(d){ L.max=Math.max(0,r2(L.max+d*s)); updateBest(L); }
    tests[i]={d,t,lab};
    L.history.push({t,max:L.max,note:lab+' → '+(d?(d>0?'+':'−')+fmt(s):'enako')});
    save(); render(); haptic(20);
    toast(d?'Nov max: <b>'+fmt(L.max)+' '+state.unit+'</b>':'Max ostane '+fmt(L.max)+' '+state.unit,{action:'Razveljavi',fn:()=>undoTest(L,pid,i)});
  },
  async testUndo(){
    const L=al(), pid=L.program, i=curSel(), rec=testArr(L)[i]; if(!rec) return;
    if(await ask({title:'Popravim rezultat?',text:rec.d?'Max se vrne za '+fmt(step())+' '+state.unit+' in rezultat lahko vneseš znova.':'Rezultat se izbriše in ga lahko vneseš znova.',ok:'Popravi'})) undoTest(L,pid,i);
  },
  finish(){
    const L=al(), pid=L.program, i=curSel(), arr=progArr(L); if(arr[i]) return;
    const wasLocked=toggleDone(L,i); rest=null; delete view.sel[state.active]; haptic(25);
    const all=arr.every(Boolean);
    render(); scrollTo({top:0,behavior:'smooth'});
    toast(all?'Cikel zaključen – odlično!':'Trening '+(i+1)+' opravljen',{action:'Razveljavi',fn:()=>{
      if(L.program!==pid||!progArr(L)[i]) return;
      toggleDone(L,i); L.locked=wasLocked; if(state.lifts[state.active]===L) view.sel[state.active]=i; save(); render();
    }});
  },
  async undone(){
    const L=al(), i=curSel();
    if(await ask({title:'Označim kot neopravljeno?',text:'Trening '+(i+1)+' bo spet odprt.',ok:'Označi'})){ if(progArr(L)[i]){ toggleDone(L,i); view.sel[state.active]=i; render(); } }
  },
  async newCycle(){
    if(await ask({title:'Začnem nov cikel?',text:'Kljukice tega programa se ponastavijo. Max ostane '+fmt(al().max)+' '+state.unit+' in se odklene.',ok:'Nov cikel'})){ resetCycle(state.active); render(); toast('Nov cikel se začne.'); }
  },

  // max sheet
  mxStep(el){ const inp=$('#mxIn'); let v=parseFloat(inp.value); if(!isFinite(v)) v=0; inp.value=Math.max(0,r2(v+(+el.dataset.d)*step())); },
  maxSave(){
    const L=al(), v=parseFloat($('#mxIn').value), lk=$('#mxLock').checked; let ch=false;
    if(isFinite(v)&&v>=0&&Math.abs(v-L.max)>1e-9){ L.max=r2(v); updateBest(L); L.history.push({t:Date.now(),max:L.max,note:'ročno'}); ch=true; }
    L.locked=lk; save(); closeTop(); render();
    if(ch) toast('Max: <b>'+fmt(L.max)+' '+state.unit+'</b>');
  },

  // programs
  progPick(el){ const L=al(); if(L.program!==el.dataset.pid){ L.program=el.dataset.pid; delete view.sel[state.active]; rest=null; save(); } closeTop(); render(); },
  progEdit(){ const pid=al().program; closeTop(); openEditor(pid); },
  progNew(){ closeTop(); newProgram(true); },
  progNewS(){ newProgram(false); },
  progOpen(el){ openEditor(el.dataset.pid); },

  // lifts
  liftEdit(el){ liftSheet(el.dataset.id); },
  liftMove(el){ const id=el.dataset.id, i=state.order.indexOf(id), j=i+(+el.dataset.d); if(i<0||j<0||j>=state.order.length) return; [state.order[i],state.order[j]]=[state.order[j],state.order[i]]; save(); render(); },
  liftSave(f){
    const L=state.lifts[f.dataset.id]; if(!L) return;
    L.name=f.elements.namedItem('name').value.trim()||L.name; L.noPlates=!f.elements.namedItem('plates').checked;
    save(); closeTop(); render();
  },
  async liftReset(el){
    const id=el.dataset.id, L=state.lifts[id];
    if(!await ask({title:'Začnem nov cikel?',text:'Kljukice programa za '+esc(L.name)+' se ponastavijo. Max ostane in se odklene.',ok:'Nov cikel'})) return;
    resetCycle(id); closeTop(); render(); toast('Nov cikel se začne.');
  },
  async liftDelete(el){
    const id=el.dataset.id, L=state.lifts[id]; if(state.order.length<=1) return;
    if(!await ask({title:'Izbrišem vajo?',text:'Vaja <b>'+esc(L.name)+'</b> in vsa njena zgodovina bosta izbrisani.',ok:'Izbriši',danger:true})) return;
    state.order=state.order.filter(x=>x!==id); delete state.lifts[id]; delete view.sel[id];
    if(state.active===id) state.active=state.order[0];
    save(); closeTop(); render(); toast('Vaja izbrisana.');
  },
  newLiftSave(f){
    const name=f.elements.namedItem('name').value.trim()||'Vaja'; let max=parseFloat(f.elements.namedItem('max').value); if(!isFinite(max)||max<0) max=0;
    const id='c'+Date.now().toString(36); state.lifts[id]=newLift(name,max,true); state.order.push(id); state.active=id;
    save(); closeTop(); render(); toast('Dodana vaja <b>'+esc(name)+'</b>');
  },

  // editor
  edCopy(){
    const cur=state.programs[edPid], id='p'+Date.now().toString(36);
    state.programs[id]={name:cur.name+' (kopija)',builtin:false,workouts:JSON.parse(JSON.stringify(cur.workouts))};
    const L=al();
    if(L.program===edPid){   // aktivna vaja preide na kopijo in obdrži napredek cikla
      ['progress','doneDates','testRes','setDone'].forEach(k=>{ if(L[k]&&L[k][edPid]) L[k][id]=JSON.parse(JSON.stringify(L[k][edPid])); });
      L.program=id;
    }
    edPid=id; save(); renderEditor(); toast('Kopija ustvarjena – zdaj jo lahko urejaš.');
  },
  edAddWk(){ const pr=state.programs[edPid], last=pr.workouts[pr.workouts.length-1]; pr.workouts.push({s:last?JSON.parse(JSON.stringify(last.s)):[[80,'5','n']]}); save(); renderEditor(); const sc=$('#edScroll'); sc.scrollTop=sc.scrollHeight; },
  edDupWk(el){ const pr=state.programs[edPid], wi=+el.dataset.w; pr.workouts.splice(wi+1,0,JSON.parse(JSON.stringify(pr.workouts[wi]))); save(); renderEditor(); },
  async edDelWk(el){ const pr=state.programs[edPid], wi=+el.dataset.w; if(pr.workouts.length<2) return; if(!await ask({title:'Izbrišem trening '+(wi+1)+'?',ok:'Izbriši',danger:true})) return; pr.workouts.splice(wi,1); save(); renderEditor(); },
  edAddSet(el){ const w=state.programs[edPid].workouts[+el.dataset.w], l=w.s[w.s.length-1]||[80,'5','n']; w.s.push([l[0],l[1],l[2]]); save(); renderEditor(); },
  edDelSet(el){ const w=state.programs[edPid].workouts[+el.dataset.w]; if(w.s.length<2) return; w.s.splice(+el.dataset.s,1); save(); renderEditor(); },
  edType(el){ const s=state.programs[edPid].workouts[+el.dataset.w].s[+el.dataset.s]; s[2]=TYPES[(TYPES.indexOf(s[2])+1)%3]; el.className='etype '+s[2]; el.textContent=TYPE[s[2]]; save(); },
  async edDelProg(){
    const pid=edPid, pr=state.programs[pid]; if(!pr||pr.builtin) return;
    if(!await ask({title:'Izbrišem program?',text:'Program <b>'+esc(pr.name)+'</b> bo izbrisan. Vaje, ki ga uporabljajo, preklopijo na Program +50.',ok:'Izbriši',danger:true})) return;
    Object.values(state.lifts).forEach(l=>{ if(l.program===pid) l.program='plus50'; });
    delete state.programs[pid]; view.sel={}; save(); closeTop(); toast('Program izbrisan.');
  },

  // progress
  logMax(){ const L=al(); L.history.push({t:Date.now(),max:L.max,note:'zabeleženo'}); save(); render(); toast('Zabeleženo: '+fmt(L.max)+' '+state.unit); },
  histDel(el){
    const L=al(), k=+el.dataset.k, e=L.history[k]; if(!e) return;
    L.history.splice(k,1); save(); render();
    toast('Vnos izbrisan',{action:'Razveljavi',fn:()=>{ L.history.splice(Math.min(k,L.history.length),0,e); save(); render(); }});
  },

  // calculator
  cStep(el){ const bar=ui.bar[state.unit]; let v=(calcT==null||!isFinite(calcT))?bar:calcT; v=Math.max(0,r2(v+(+el.dataset.d)*step())); calcT=v; $('#cT').value=v; renderCalcOut(); },
  cPct(el){ calcT=calc(+el.dataset.p,al().max); $('#cT').value=calcT; renderCalcOut(); },
  cBar(el){ ui.bar[state.unit]=+el.dataset.b; saveUI(); renderCalc(); },

  // settings
  async unit(el){
    const u=el.dataset.u; if(state.unit===u) return;
    if(!await ask({title:'Preklopim na '+u+'?',text:'Vsi maxi in zgodovina se pretvorijo in zaokrožijo na '+(u==='kg'?'2,5 kg':'5 lb')+'.',ok:'Preklopi'})) return;
    setUnit(u); toast('Enota: '+u);
  },
  export(){ exportJSON(); },
  import(){ $('#importFile').click(); }
};
function undoTest(L,pid,i){
  const arr=L.testRes&&L.testRes[pid], rec=arr&&arr[i]; if(!rec) return;
  if(rec.d) L.max=Math.max(0,r2(L.max-rec.d*step()));
  for(let k=L.history.length-1;k>=0;k--){ if(Math.abs(L.history[k].t-rec.t)<2000){ L.history.splice(k,1); break; } }
  arr[i]=null; save(); render();
}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){ closeTop(); return; }
  const t=e.target.closest('[data-act]'); if(!t||t.disabled) return;
  const fn=ACT[t.dataset.act]; if(fn) fn(t,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('li[data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('submit',e=>{ e.preventDefault(); const fn=ACT[e.target.dataset.submit]; if(fn) fn(e.target); });
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cT'){ const v=parseFloat(t.value); calcT=isFinite(v)?v:null; renderCalcOut(); }
  else if(t.id==='cB'){
    const v=parseFloat(t.value); if(!isFinite(v)||v<0) return;
    ui.bar[state.unit]=v; saveUI(); renderCalcOut();
    document.querySelectorAll('.bars .chip').forEach(c=>c.classList.toggle('on',c.classList.contains('inpchip')?!BARS[state.unit].includes(v):+c.dataset.b===v));
  }
});
$('#importFile').addEventListener('change',e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; });
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});

// ===== install (PWA) =====
let deferredPrompt=null;
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const showInstall=()=>!isStandalone&&!ui.installHide&&(!!deferredPrompt||isIOS);
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; if(ui.tab==='train'||ui.tab==='settings') render(); });
addEventListener('appinstalled',()=>{ deferredPrompt=null; render(); toast('Aplikacija nameščena.'); });

// ===== boot =====
loadUI(); load(); render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(refreshing) return; refreshing=true; saveNow(); location.reload(); });
  const showUpdate=w=>{ const b=$('#upd'); b.classList.add('show'); $('#updBtn').onclick=()=>{ b.classList.remove('show'); if(w) w.postMessage('skipWaiting'); }; };
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      if(reg.waiting&&navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound',()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller) showUpdate(nw); }); });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
