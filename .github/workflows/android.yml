name: Android APK

# Ob vsaki spremembi aplikacije na main zgradi APK in ga objavi kot GitHub Release (v<številka>).
# Android aplikacija preverja najnovejšo izdajo in ponudi posodobitev.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon*'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Podpisni ključ iz secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Manjka secret KEYSTORE_BASE64 (glej README, razdelek Android aplikacija)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plus50.keystore"

      - name: Zgradi APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/plus50.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Objavi izdajo
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk plus50.apk
          gh release create "v${{ github.run_number }}" plus50.apk \
            --title "Program +50 · 1.${{ github.run_number }}" \
            --notes "${NOTES:-Nova različica.}"
